name: Tests

# Le Pi se met à jour tout seul depuis `main` (voir DEPLOY_PI.md, section 11) :
# ce workflow, exigé avant fusion, est le garde-fou avant la production.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # version de Raspberry Pi OS Bookworm
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
