{# Pastille d'état d'un puzzle : coche (résolu) ou cadenas (pas encore ouvert). Le texte reste lu par les lecteurs d'écran. #}
{% if done %}
<svg class="etat etat--done" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.25"/><path d="M4.6 8.3l2.4 2.4 4.4-4.9"/></svg><span class="visually-hidden">résolue</span>
{% elif locked %}
<svg class="etat etat--locked" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M5 7V5a3 3 0 0 1 6 0v2"/><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/></svg>
{% endif %}
